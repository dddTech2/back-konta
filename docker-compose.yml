# Despliegue de prueba en un solo servidor: 4 contenedores (api, bot, scheduler, worker) + 2 volumenes
# compartidos (datos y perfil persistente de Chrome). Requiere que, en el servidor, la carpeta
# ProyectoDianFront exista como hermana de esta (../ProyectoDianFront), igual que en local.
#
# Uso:
#   cp .env.example .env   # y completar TELEGRAM_BOT_TOKEN, ADMIN_TELEGRAM_CHAT_ID, etc.
#   (cd ../ProyectoDianFront && npm ci && npm run build)   # la API sirve ../ProyectoDianFront/dist
#   docker compose up -d --build   # el servicio `migrate` crea/actualiza las tablas antes de arrancar el resto
#   docker compose exec api python -m dian_automation.core.calendar_loader data/calendario_dian_2026.csv   # una vez
# Worker local (solo pruebas, ver abajo): docker compose --profile local-worker up -d
#   docker compose logs -f bot      # confirmar "Conectado con éxito como: @tu_bot"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6390:6379"   # expuesto a internet a propósito: el worker remoto (en casa) debe alcanzarlo
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Aplica las migraciones de Alembic (crea las tablas en un volumen nuevo y actualiza uno existente) y termina.
  # api, bot y scheduler esperan a que acabe bien; con un solo migrador no compiten por el archivo SQLite.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["migrate"]
    env_file: .env
    volumes:
      - kontable_data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["api"]
    env_file: .env
    environment:
      FRONTEND_DIR: /frontend/dist
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0   # dentro de la red de compose Redis es "redis", no localhost
    ports:
      - "8020:8000"
    volumes:
      - kontable_data:/data
      - ../ProyectoDianFront:/frontend:ro
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["bot"]
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0   # dentro de la red de compose Redis es "redis", no localhost
    volumes:
      - kontable_data:/data
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Programador semanal de descargas (Story 1.7): solo encola, nunca abre la DIAN. Nace apagado:
  # no encola nada hasta que SCHEDULER_ENABLED=true en .env (actívalo cuando el worker remoto
  # arranque solo: docs/DEPLOYMENT.md). Corrida por defecto: domingo 03:00 (America/Bogota).
  # Aunque esté apagado, vigila el latido del worker y avisa por Telegram si deja de responder (Story 1.8).
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["scheduler"]
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0   # dentro de la red de compose Redis es "redis", no localhost
    volumes:
      - kontable_data:/data
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Worker LOCAL: solo útil para pruebas desde una máquina/IP que la DIAN no bloquee. No arranca con
  # `docker compose up`: hay que pedirlo con `--profile local-worker`. En el VPS debe quedar apagado, porque
  # tomaría trabajos de la cola desde la IP bloqueada y los haría fallar. En el despliegue real, el worker
  # corre aparte desde una red residencial (`run_worker_remote.py` o kontable-worker.exe): docs/DEPLOYMENT.md.
  worker:
    profiles: ["local-worker"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0   # dentro de la red de compose Redis es "redis", no localhost
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - kontable_data:/data
      - browser_profile:/app/.browser_profile
    restart: unless-stopped
    shm_size: "1gb"

volumes:
  kontable_data:
  browser_profile:
  redis_data:
