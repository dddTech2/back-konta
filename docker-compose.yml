# Despliegue de prueba en un solo servidor: 4 contenedores (api, bot, scheduler, worker) + 2 volumenes
# compartidos (datos y perfil persistente de Chrome). Requiere que, en el servidor, la carpeta
# ProyectoDianFront exista como hermana de esta (../ProyectoDianFront), igual que en local.
#
# Uso:
#   cp .env.example .env   # y completar TELEGRAM_BOT_TOKEN, ADMIN_TELEGRAM_CHAT_ID, etc.
#   docker compose up -d --build
#   docker compose logs -f bot      # confirmar "Conectado con éxito como: @tu_bot"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6390:6379"   # expuesto a internet a propósito: el worker remoto (en casa) debe alcanzarlo
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["api"]
    env_file: .env
    environment:
      FRONTEND_DIR: /frontend/dist
    ports:
      - "8020:8000"
    volumes:
      - kontable_data:/data
      - ../ProyectoDianFront:/frontend:ro
    depends_on:
      - redis
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["bot"]
    env_file: .env
    volumes:
      - kontable_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  # Programador semanal de descargas (Story 1.7): solo encola, nunca abre la DIAN. Nace apagado:
  # no encola nada hasta que SCHEDULER_ENABLED=true en .env (actívalo cuando el worker remoto
  # arranque solo, Story 1.8). Corrida por defecto: domingo 03:00 (America/Bogota).
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["scheduler"]
    env_file: .env
    volumes:
      - kontable_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  # Worker LOCAL: solo útil para pruebas desde una máquina/IP que la DIAN no bloquee.
  # En el despliegue real, el worker corre aparte con `python run_worker_remote.py`
  # desde una red residencial -- ver docs/DEPLOYMENT.md. Puedes comentar este servicio
  # si vas a usar exclusivamente el worker remoto.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["worker"]
    env_file: .env
    volumes:
      - kontable_data:/data
      - browser_profile:/app/.browser_profile
    restart: unless-stopped
    shm_size: "1gb"

volumes:
  kontable_data:
  browser_profile:
  redis_data:
